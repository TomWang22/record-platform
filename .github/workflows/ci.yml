name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL_AUTH: postgresql://postgres:postgres@localhost:5432/postgres?schema=auth
      POSTGRES_URL_RECORDS: postgresql://postgres:postgres@localhost:5432/postgres?schema=records
      REDIS_URL: redis://localhost:6379
      POSTGRES_URL_LISTINGS: postgresql://postgres:postgres@localhost:5432/postgres
    strategy:
      matrix:
        service: [api-gateway, auth-service, records-service, listings-service, analytics-service, social-service, shopping-service, auction-monitor]
    steps:
      - uses: actions/checkout@v4

      # install pnpm first (adds the pnpm binary reliably)
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      # then setup node and enable pnpm cache
      # Use a unique cache key per service to avoid conflicts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      # (optional) fix rare git safe-directory hiccups
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: pnpm -v
      - run: pnpm install --frozen-lockfile

      # ensure workspace lib is compiled first
      # This must happen before any service builds since they depend on @common/utils
      - name: Build common package
        run: |
          echo "Building @common/utils package..."
          cd services/common
          pnpm build
          echo "Verifying build output exists..."
          if [ ! -d "dist" ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "ERROR: dist directory is empty or missing!"
            exit 1
          fi
          echo "Build output verified:"
          ls -la dist/ | head -10

      # build each service from the matrix
      - name: Build ${{ matrix.service }}
        run: pnpm -C services/${{ matrix.service }} build

  python-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          cd services/python-ai-service
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          python -c "import fastapi,uvicorn; print('ai ok')"