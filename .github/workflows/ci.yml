# Production CI: build (matrix), test, docker-build (cached), QUIC invariant, transport validation, python-ai, artifacts.
# Uses stable major tags; .vscode/settings.json treats workflows as yaml to avoid IDE action-resolution noise.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.13
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL_AUTH: postgresql://postgres:postgres@localhost:5432/postgres?schema=auth
      POSTGRES_URL_RECORDS: postgresql://postgres:postgres@localhost:5432/postgres?schema=records
      POSTGRES_URL_LISTINGS: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - records-service
          - listings-service
          - shopping-service
          - messaging-service
          - media-service
          - trust-service
          - notification-service
          - analytics-service
          - python-ai-service
          - auction-monitor
          - transport-watchdog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf services/common/dist services/common/tsconfig.tsbuildinfo
          pnpm --filter @common/utils run build
          test -f services/common/dist/index.d.ts

      - name: Build service
        shell: bash
        run: |
          set -euo pipefail
          svc="${{ matrix.service }}"
          if [[ "$svc" == "python-ai-service" ]]; then
            python3 -m compileall -q "services/$svc"
            echo "python-ai-service: Python compile check OK"
          else
            pnpm -C "services/$svc" build
          fi

  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - records-service
          - listings-service
          - shopping-service
          - messaging-service
          - media-service
          - trust-service
          - notification-service
          - analytics-service
          - python-ai-service
          - auction-monitor
          - transport-watchdog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common package
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @common/utils run build
          test -f services/common/dist/index.d.ts

      - name: Test service
        shell: bash
        run: |
          set -euo pipefail
          svc="${{ matrix.service }}"
          if [[ "$svc" == "python-ai-service" ]]; then
            echo "python-ai-service: unit tests run in coverage workflow"
            exit 0
          fi
          if [[ ! -f "services/$svc/package.json" ]]; then
            echo "No package.json for $svc — skip"
            exit 0
          fi
          pnpm -C "services/$svc" run --if-present test

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - records-service
          - listings-service
          - shopping-service
          - messaging-service
          - media-service
          - trust-service
          - notification-service
          - analytics-service
          - python-ai-service
          - auction-monitor
          - transport-watchdog
          - webapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ matrix.service }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.service }}-

      - name: Build image
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          if [ "${{ matrix.service }}" = "webapp" ]; then
            df="webapp/Dockerfile"
          else
            df="services/${{ matrix.service }}/Dockerfile"
          fi
          docker buildx build \
            --load \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t ${{ matrix.service }}:ci \
            -f "$df" \
            .

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  quic-invariants:
    name: Enforce QUIC hostname invariant
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure no IP-based HTTP/3 usage
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/check-no-ip-quic.sh
          bash scripts/check-no-ip-quic.sh

  transport-validation:
    name: Transport validation gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate transport tooling (no pcap)
        shell: bash
        run: |
          set -euo pipefail
          out=$(python3 scripts/lib/transport_validator.py 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q "no pcap provided"; then
            echo "Validator correctly requires pcap when none provided."
          else
            echo "$out" | grep -q '"valid": true'
          fi
          python3 scripts/lib/transport_validator_selftest.py

      - name: Transport validation with canonical PCAP (required)
        shell: bash
        run: |
          set -euo pipefail
          echo "Tracked PCAP files:"
          git ls-files 'bench_logs/security-contract/pcap/**' || true
          echo "LFS PCAP files:"
          git lfs ls-files 'bench_logs/security-contract/pcap' || true
          echo "Materialized captures:"
          find bench_logs/security-contract/pcap -maxdepth 1 -type f -ls || true
          sudo apt-get update -qq
          sudo apt-get install -y tshark
          bash scripts/verify-transport-pcap-fixture.sh

  python-ai:
    name: Python AI validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install and sanity check
        shell: bash
        run: |
          set -euo pipefail
          cd services/python-ai-service
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import fastapi, uvicorn; print('ai ok')"

  ai-platform-phase32g-infra:
    name: Phase 32G infra verifier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Phase 32G infrastructure verifier (CI-safe)
        run: make ai-platform-verify-phase32g-infra

  git-no-cursor-trailers:
    name: Git no-Cursor trailer guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify no Cursor commit trailers
        run: make git-verify-no-cursor-trailers

  artifacts:
    name: Upload rotation artifacts
    if: always()
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload reports (if exist)
        uses: actions/upload-artifact@v4
        with:
          name: rotation-reports
          path: |
            rotation-summary.json
            rotation-report.json
          if-no-files-found: ignore
