name: ci
on: [push, pull_request]

jobs:
  build-common:
    name: Build @common/utils (once)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - name: Build common package
        run: |
          rm -rf services/common/dist services/common/tsconfig.tsbuildinfo
          pnpm -C services/common build
          test -f services/common/dist/index.d.ts || (echo "ERROR: common build failed" && exit 1)
      - uses: actions/cache/save@v4
        with:
          path: services/common/dist
          key: common-${{ hashFiles('pnpm-lock.yaml', 'services/common/**') }}

  build:
    needs: build-common
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL_AUTH: postgresql://postgres:postgres@localhost:5432/postgres?schema=auth
      POSTGRES_URL_RECORDS: postgresql://postgres:postgres@localhost:5432/postgres?schema=records
      REDIS_URL: redis://localhost:6379
      POSTGRES_URL_LISTINGS: postgresql://postgres:postgres@localhost:5432/postgres
    strategy:
      matrix:
        service: [api-gateway, auth-service, records-service, listings-service, analytics-service, social-service, shopping-service, auction-monitor, cron-jobs]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - name: Restore common build
        uses: actions/cache/restore@v4
        with:
          path: services/common/dist
          key: common-${{ hashFiles('pnpm-lock.yaml', 'services/common/**') }}
      - name: Build common if cache miss
        run: |
          if [ ! -f "services/common/dist/index.d.ts" ]; then
            echo "Common cache miss; building common..."
            pnpm -C services/common build
          fi
      - name: Build ${{ matrix.service }}
        run: |
          test -f "services/common/dist/index.d.ts" || (echo "ERROR: @common/utils dist missing" && exit 1)
          pnpm -C services/${{ matrix.service }} build

  quic-invariants:
    name: Enforce QUIC hostname invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No IP-based HTTP/3 usage
        run: ./scripts/check-no-ip-quic.sh

  transport-validation:
    name: Transport validation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate transport tooling (no pcap)
        run: |
          python3 scripts/lib/transport_validator.py 2>/dev/null; e=$?
          if [ "$e" -eq 2 ]; then
            echo "Validator correctly requires pcap when none provided (exit 2)."
            exit 0
          fi
          exit $e
      - name: Transport validation with pcap (only if vm.pcap present)
        run: |
          if [ -f vm.pcap ]; then
            sudo apt-get update -qq && sudo apt-get install -y tshark
            python3 scripts/run_transport_validation.py --pcap vm.pcap --v2 --require-transport-proof
          else
            echo "No vm.pcap; skip tshark install and full gate."
          fi

  python-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          cd services/python-ai-service
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          python -c "import fastapi,uvicorn; print('ai ok')"