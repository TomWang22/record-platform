name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL_AUTH: postgresql://postgres:postgres@localhost:5432/postgres?schema=auth
      POSTGRES_URL_RECORDS: postgresql://postgres:postgres@localhost:5432/postgres?schema=records
      REDIS_URL: redis://localhost:6379
      POSTGRES_URL_LISTINGS: postgresql://postgres:postgres@localhost:5432/postgres
    strategy:
      matrix:
        service: [api-gateway, auth-service, records-service, listings-service, analytics-service, social-service, shopping-service, auction-monitor]
    steps:
      - uses: actions/checkout@v4

      # install pnpm first (adds the pnpm binary reliably)
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      # then setup node and enable pnpm cache
      # Use a unique cache key per service to avoid conflicts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      # (optional) fix rare git safe-directory hiccups
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: pnpm -v
      - run: pnpm install --frozen-lockfile

      # Set working directory explicitly to repo root
      - name: Verify working directory
        run: |
          echo "Working directory: $(pwd)"
          echo "Repository root contents:"
          ls -la | head -10
          echo "Services directory exists:"
          test -d services && echo "✅ services/ exists" || echo "❌ services/ missing"

      # ensure workspace lib is compiled first
      # This must happen before any service builds since they depend on @common/utils
      - name: Build common package
        run: |
          echo "Building @common/utils package..."
          echo "Current directory: $(pwd)"
          echo "Cleaning dist and buildinfo to ensure fresh build:"
          rm -rf services/common/dist services/common/tsconfig.tsbuildinfo
          echo "Running build command:"
          cd services/common && pnpm build
          echo ""
          echo "Build command exit code: $?"
          echo ""
          echo "Verifying build output exists..."
          echo "Checking: services/common/dist/"
          if [ -d "services/common/dist" ]; then
            ls -la services/common/dist/ 2>&1 | head -15
          else
            echo "ERROR: dist directory not found!"
            echo "Current working directory: $(pwd)"
            echo "Listing services/common contents:"
            ls -la services/common/ | head -15
            echo "Checking for TypeScript errors:"
            cd services/common && pnpm exec tsc --noEmit 2>&1 | head -20
            exit 1
          fi
          echo ""
          if [ -z "$(ls -A services/common/dist 2>/dev/null)" ]; then
            echo "ERROR: dist directory is empty!"
            echo "Current working directory: $(pwd)"
            echo "Listing services/common:"
            ls -la services/common/ | head -15
            echo "Running TypeScript with verbose output:"
            cd services/common && pnpm exec tsc -p tsconfig.json --listEmittedFiles 2>&1 | head -20
            exit 1
          fi
          echo "Build output verified:"
          ls -la services/common/dist/ | head -15
          echo ""
          echo "Verifying key files exist:"
          if [ -f "services/common/dist/index.d.ts" ]; then
            echo "✅ dist/index.d.ts exists ($(wc -l < services/common/dist/index.d.ts) lines)"
          else
            echo "❌ dist/index.d.ts missing!"
            echo "Files in dist/:"
            ls -la services/common/dist/ || echo "dist/ doesn't exist"
            echo "Checking TypeScript compilation:"
            cd services/common && pnpm exec tsc --listFiles 2>&1 | head -10
            exit 1
          fi
          test -f services/common/dist/grpc-clients.d.ts && echo "✅ dist/grpc-clients.d.ts exists" || echo "⚠️  dist/grpc-clients.d.ts missing (may be ok)"
          test -f services/common/dist/proto.d.ts && echo "✅ dist/proto.d.ts exists" || echo "⚠️  dist/proto.d.ts missing (may be ok)"
          echo ""
          echo "Verifying package.json exports point to dist:"
          cat services/common/package.json | grep -A 2 '"main"'

      # build each service from the matrix
      - name: Build ${{ matrix.service }}
        run: |
          echo "Building ${{ matrix.service }}..."
          # Verify common package is available before building
          if [ ! -f "services/common/dist/index.d.ts" ]; then
            echo "ERROR: @common/utils dist/index.d.ts not found!"
            echo "This should have been built in the previous step."
            exit 1
          fi
          pnpm -C services/${{ matrix.service }} build

  python-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          cd services/python-ai-service
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          python -c "import fastapi,uvicorn; print('ai ok')"