# Syntax-check Kafka DNS validation script (no cluster on ubuntu-latest).
name: kafka-dns-validate

on:
  push:
    branches:
      - main
      - master
      - develop
      - fix/**
      - feat/**
      - feature/**
      - chore/**
      - hotfix/**
    paths:
      - "scripts/validate-kafka-dns.sh"
      - "scripts/diagnose-kafka-broker-dns.sh"
      - "scripts/verify-kafka-broker-tls-eku.sh"
      - "scripts/run-preflight-scale-and-all-suites.sh"
      - "scripts/preflight-kafka-k8s-rollout.sh"
      - "scripts/create-kafka-event-topics-k8s.sh"
      - "infra/k8s/kafka-kraft-metallb/**"
      - "infra/k8s/kafka-certs/**"
      - "infra/ops/**"
      - "infra/policies/kafka-replica-guard.yaml"
      - "docs/kafka/**"
      - "docs/bundles/TARBALL_SELECTIVE_MERGE.md"
      - "infra/k8s/kafka-kraft-metallb/README.md"
      - "infra/k8s/overlays/kafka-host-compose/**"
      - "infra/k8s/monitoring/**"
      - "monitoring/prometheus-rules/kafka-kraft-dns.yaml"
      - "monitoring/prometheus-rules/service-slos.yaml"
      - "infra/k8s/base/observability/prometheus-rules-kafka-health.yaml"
      - "scripts/verify-outbox-infra-alignment.sh"
      - "scripts/run-chaos-suite.sh"
      - "scripts/run-governed-chaos.sh"
      - "scripts/chaos-kafka-broker.sh"
      - "scripts/chaos-metallb-kafka-lb.sh"
      - "scripts/chaos-kafka-partition.sh"
      - "scripts/chaos-kafka-alignment-stochastic.sh"
      - "scripts/chaos-node-reboot.sh"
      - "scripts/chaos-expired-ca.sh"
      - "scripts/chaos-latency.sh"
      - "scripts/calc-failure-budget.py"
      - "services/common/**"
      - "webapp/e2e/**"
      - "webapp/playwright.config.ts"
      - "scripts/e2e/**"
      - "scripts/tls/**"
      - "docs/OUTBOX_*.md"
      - "docs/GDPR_ACCOUNT_DELETION_AND_ANONYMIZATION.md"
      - "docs/SERVICE_SLO_SLA.md"
      - ".github/workflows/**"
  # Every PR runs (same checks without guessing which paths changed).
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shell-and-kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"
      - name: Bash syntax (Kafka helper scripts)
        run: |
          bash -n scripts/validate-kafka-dns.sh
          bash -n scripts/diagnose-kafka-broker-dns.sh
          bash -n scripts/verify-kafka-broker-tls-eku.sh
          bash -n scripts/run-preflight-scale-and-all-suites.sh
          bash -n scripts/preflight-kafka-k8s-rollout.sh
          bash -n scripts/create-kafka-event-topics-k8s.sh
          bash -n scripts/verify-outbox-infra-alignment.sh
          bash -n scripts/run-chaos-suite.sh
          bash -n scripts/run-governed-chaos.sh
          bash -n scripts/chaos-kafka-broker.sh
          bash -n scripts/chaos-metallb-kafka-lb.sh
          bash -n scripts/chaos-kafka-partition.sh
          bash -n scripts/chaos-kafka-alignment-stochastic.sh
          bash -n scripts/chaos-node-reboot.sh
          bash -n scripts/chaos-expired-ca.sh
          bash -n scripts/chaos-latency.sh
      - name: Outbox ↔ proto ↔ topic alignment
        run: ./scripts/verify-outbox-infra-alignment.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Outbox library tests (@common/utils)
        run: pnpm install --frozen-lockfile && pnpm -C services/common run build && pnpm -C services/common run test
      - name: Kustomize build kafka-kraft-metallb
        run: kubectl kustomize infra/k8s/kafka-kraft-metallb/ >/tmp/kafka-kraft.yaml && test -s /tmp/kafka-kraft.yaml
      - name: Kustomize build kafka-certs (cert-manager CRs)
        run: kubectl kustomize infra/k8s/kafka-certs/ >/tmp/kafka-certs.yaml && test -s /tmp/kafka-certs.yaml
      - name: Kustomize build kafka-host-compose overlay
        run: kubectl kustomize infra/k8s/overlays/kafka-host-compose/ >/tmp/kafka-host-compose.yaml && test -s /tmp/kafka-host-compose.yaml
      - name: Assert KRaft bundle is three brokers (replicas)
        run: |
          set -euo pipefail
          grep -qE 'replicas:[[:space:]]+3\b' /tmp/kafka-kraft.yaml || {
            echo "::error::Expected replicas: 3 in rendered kafka-kraft-metallb (3-broker KRaft contract)."
            exit 1
          }
      - name: Kustomize build infra ops
        run: kubectl kustomize infra/ops/ >/tmp/kafka-ops.yaml && test -s /tmp/kafka-ops.yaml
      - name: Offline infra schema validation (ops, observability, VAP)
        run: bash scripts/verify-kafka-prometheus-rules-offline.sh
