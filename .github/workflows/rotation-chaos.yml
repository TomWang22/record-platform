name: rotation-chaos

on:
  schedule:
    - cron: "0 6 * * *"  # nightly
  workflow_dispatch:

jobs:
  chaos-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Install k3s
      run: |
        curl -sfL https://get.k3s.io | sh -
        sudo chmod +x /usr/local/bin/kubectl || true
        mkdir -p ~/.kube
        sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
        sudo chown $USER:$USER ~/.kube/config
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

    - name: Wait for k3s to be ready
      run: |
        export KUBECONFIG=~/.kube/config
        timeout 120 bash -c 'until kubectl get nodes 2>/dev/null; do sleep 2; done'

    - name: Deploy platform
      run: |
        if [[ ! -x ./deploy.sh ]]; then
          echo "deploy.sh not found or not executable"
          exit 1
        fi
        timeout 600 ./deploy.sh || { echo "Deploy failed or timed out (10m)"; exit 1; }

    - name: Install mkcert
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3-tools
        curl -sSL -o mkcert "https://github.com/FiloSottile/mkcert/releases/latest/download/mkcert-linux-amd64"
        chmod +x mkcert
        sudo mv mkcert /usr/local/bin/
        mkcert -install

    - name: Install packet capture tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y tcpdump tshark strace valgrind htop 2>/dev/null || true

    - name: Run rotation + chaos suite with wire-level verification
      env:
        WIRE_VERIFY: "true"
        ENABLE_PACKET_CAPTURE: "true"
      run: |
        timeout 1200 ./scripts/rotation-suite.sh || { echo "Rotation suite failed or timed out (20m)"; exit 1; }

    - name: Analyze packet captures
      if: always()
      continue-on-error: true
      run: |
        if command -v tshark >/dev/null 2>&1; then
          echo "=== Protocol Verification ==="
          find /tmp -name "rotation-*.pcap" -type f 2>/dev/null | while read pcap; do
            echo "Analyzing: $pcap"
            tshark -r "$pcap" -Y "http2 or quic" -c 10 2>/dev/null || echo "No HTTP/2 or QUIC packets found"
          done
        else
          echo "tshark not available, skipping capture analysis"
        fi
