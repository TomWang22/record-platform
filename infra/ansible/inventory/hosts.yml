# Local dev: Colima k3s. Set kubeconfig_context to "colima" to target Colima.
all:
  children:
    kubernetes:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          kubeconfig_path: "~/.kube/config"
          kubeconfig_context: "colima"  # Colima k3s; use null for current context

