apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: record-platform
  labels: { app: analytics-service }
spec:
  replicas: 2  # Increased from 1 for high availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Zero-downtime deployments
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata:
      labels: { app: analytics-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4004"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: analytics-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4004
            - name: grpc
              containerPort: 50054
          # NEW: pull env from shared ConfigMap + Secret
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          # keep any explicit env if you need to override
          env:
            - name: NODE_ENV
              value: "development"
            - name: GRPC_PORT
              value: "50054"
            - name: ENABLE_GRPC
              value: "true"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/secrets/ca-cert.pem"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: kafka-ssl-certs
              mountPath: /etc/kafka/secrets
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10  # Increased from 3s to match Python AI service and handle load
            failureThreshold: 5  # Increased from 3 to be more tolerant under load
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15  # Increased from 5s to match Python AI service and handle load
            failureThreshold: 5  # Increased from 3 to be more tolerant under load
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: kafka-ssl-certs
          secret:
            secretName: kafka-ssl-secret
            optional: true  # Optional for dev (can use PLAINTEXT if not available)