apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: record-platform
  labels: { app: analytics-service }
spec:
  replicas: 1  # Scaled to 1 for development
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Zero-downtime deployments
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata:
      labels: { app: analytics-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4004"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: analytics-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4004
            - name: grpc
              containerPort: 50054
          # NEW: pull env from shared ConfigMap + Secret
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          # keep any explicit env if you need to override
          env:
            - name: NODE_ENV
              value: "development"
            - name: GRPC_PORT
              value: "50054"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"  # Enable client cert verification for production
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: KAFKA_BROKER
              value: "kafka-external.record-platform.svc.cluster.local:9093"
            - name: KAFKA_USE_SSL
              value: "true"
            - name: KAFKA_SSL_ENABLED
              value: "true"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/secrets/ca-cert.pem"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-ssl-certs
              mountPath: /etc/kafka/secrets
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # gRPC Health Checks (grpc.health.v1.Health/Check) - HTTP/2 only
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50054
                - -service=analytics.AnalyticsService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 35
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50054
                - -service=analytics.AnalyticsService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 35
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50054
                - -service=analytics.AnalyticsService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 35
            failureThreshold: 30
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-ssl-certs
          secret:
            secretName: kafka-ssl-secret