apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: record-platform
  labels: { app: analytics-service }
spec:
  replicas: 1  # Scaled to 1 for development
  strategy:
    type: Recreate
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata:
      labels: { app: analytics-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4017"
        prometheus.io/path: "/metrics"
    spec:
      hostAliases:
        - ip: "192.168.5.2"
          hostnames:
            - "host.docker.internal"
            - "host.lima.internal"
      initContainers:
        - name: wait-db
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              for i in $(seq 1 90); do
                nc -zv host.docker.internal 5433 2>/dev/null && \
                nc -zv host.docker.internal 5435 2>/dev/null && \
                nc -zv host.docker.internal 5439 2>/dev/null && exit 0
                sleep 2
              done
              echo "External Postgres unreachable (need 5433 records, 5435 listings, 5439 analytics); ensure docker compose up and hostAliases (scripts/colima-apply-host-aliases.sh)"
              exit 1
      containers:
        - name: app
          image: analytics-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4017
            - name: grpc
              containerPort: 50067
          # NEW: pull env from shared ConfigMap + Secret
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          # keep any explicit env if you need to override
          env:
            - name: NODE_ENV
              value: "development"
            # Pool sizing for rotation/load: avoid 5433 timeouts and connection starvation (Little's Law; 50/25 + no idle recycle during chaos)
            - name: DB_POOL_MAX
              value: "50"
            - name: DB_POOL_MIN
              value: "0"
            - name: ANALYTICS_DB_WARMUP_ATTEMPTS
              value: "90"
            - name: DB_IDLE_TIMEOUT_MS
              value: "0"
            - name: GRPC_PORT
              value: "50067"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"  # Strict mTLS: Envoy presents client cert to backends
            - name: TLS_CA_PATH
              value: "/certs/dev-root.pem"  # Must match CA that signs Envoy client cert
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_SSL
              value: "true"
            - name: KAFKA_SSL_ENABLED
              value: "true"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/secrets/ca-cert.pem"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-ssl-certs
              mountPath: /etc/kafka/secrets
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-ssl-certs
          secret:
            secretName: kafka-ssl-secret