apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-monitor
  namespace: record-platform
  labels: { app: auction-monitor }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auction-monitor }
  template:
    metadata:
      labels: { app: auction-monitor }
      annotations:
        # If you expose metrics on /metrics, Prom can scrape this; otherwise harmless
        prometheus.io/scrape: "true"
        prometheus.io/port: "4008"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: auction-monitor:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4008
            - name: grpc
              containerPort: 50059
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
            - secretRef:
                name: ebay-credentials
                optional: true  # Optional - service can run without eBay credentials
          env:
            # You used this in compose
            - name: BASE_URL
              value: "http://haproxy.record-platform.svc.cluster.local:8081"
            # Dual-DB setup: listings DB for reading watchlist, auction-monitor DB for writing results
            - name: POSTGRES_URL_LISTINGS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_LISTINGS
            - name: POSTGRES_URL_AUCTION_MONITOR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_AUCTION_MONITOR
            # Legacy POSTGRES_URL defaults to auction-monitor DB
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_AUCTION_MONITOR
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-external.record-platform.svc.cluster.local:9093"
            - name: KAFKA_BROKER
              value: "kafka-external.record-platform.svc.cluster.local:9093"
            - name: KAFKA_USE_SSL
              value: "true"
            - name: KAFKA_SSL_ENABLED
              value: "true"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/secrets/ca-cert.pem"
            # Ensure Node.js uses the CA cert for Kafka TLS verification
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/kafka/secrets/ca-cert.pem:/certs/dev-root.pem"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_PORT
              value: "50059"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"  # Enable mTLS (mutual TLS) - client cert verification
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-ssl-certs
              mountPath: /etc/kafka/secrets
              readOnly: true
          # gRPC Health Checks (grpc.health.v1.Health/Check) - HTTP/2 only
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50059
                - -service=auction_monitor.AuctionMonitorService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 35
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50059
                - -service=auction_monitor.AuctionMonitorService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 35
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50059
                - -service=auction_monitor.AuctionMonitorService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 35
            failureThreshold: 30
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-ssl-certs
          secret:
            secretName: kafka-ssl-secret