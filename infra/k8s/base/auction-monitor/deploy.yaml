apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-monitor
  namespace: record-platform
  labels: { app: auction-monitor }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: auction-monitor }
  template:
    metadata:
      labels: { app: auction-monitor }
      annotations:
        rp.dev/kafka-client-leaf-sha256: "E7:2E:EA:B3:11:1A:F7:B3:D7:A6:EB:FE:BE:DF:3A:BF:8B:DE:A7:22:37:E7:FA:57:3E:8F:78:1F:E3:A0:EE:0F"
        # If you expose metrics on /metrics, Prom can scrape this; otherwise harmless
        prometheus.io/scrape: "true"
        prometheus.io/port: "4008"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: auction-monitor:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4008
            - name: grpc
              containerPort: 50059
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
            - secretRef:
                name: ebay-credentials
                optional: true  # Optional - service can run without eBay credentials
          env:
            # You used this in compose
            - name: BASE_URL
              value: "http://haproxy.record-platform.svc.cluster.local:8081"
            # Dual-DB setup: listings DB for reading watchlist, auction-monitor DB for writing results
            - name: POSTGRES_URL_LISTINGS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_LISTINGS
            - name: POSTGRES_URL_AUCTION_MONITOR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_AUCTION_MONITOR
            # Legacy POSTGRES_URL defaults to auction-monitor DB
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_AUCTION_MONITOR
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_SSL
              value: "true"
            - name: KAFKA_SSL_ENABLED
              value: "true"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/client/ca-chain.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/client/tls.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/client/tls.key"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_PORT
              value: "50059"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"  # Strict mTLS: Envoy presents client cert to backends
            - name: TLS_CA_PATH
              value: "/etc/certs/ca.crt"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-client-tls
              mountPath: /etc/kafka/client
              readOnly: true

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls-auction-monitor
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-client-tls
          secret:
            secretName: kafka-client-tls-auction-monitor
            defaultMode: 420
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
            - key: ca-chain.pem
              path: ca-chain.pem
