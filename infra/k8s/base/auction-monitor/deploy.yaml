apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-monitor
  namespace: record-platform
  labels: { app: auction-monitor }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auction-monitor }
  template:
    metadata:
      labels: { app: auction-monitor }
      annotations:
        # If you expose metrics on /metrics, Prom can scrape this; otherwise harmless
        prometheus.io/scrape: "true"
        prometheus.io/port: "4008"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: auction-monitor:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4008
            - name: grpc
              containerPort: 50059
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            # You used this in compose
            - name: BASE_URL
              value: "http://haproxy.record-platform.svc.cluster.local:8081"
            # Dual-DB setup: listings DB for reading watchlist, auction-monitor DB for writing results
            - name: POSTGRES_URL_LISTINGS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_LISTINGS
            - name: POSTGRES_URL_AUCTION_MONITOR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_AUCTION_MONITOR
            # Legacy POSTGRES_URL defaults to auction-monitor DB
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_AUCTION_MONITOR
            # Only if you actually have Kafka in K8s; otherwise remove/override in app-config
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.record-platform.svc.cluster.local:9092"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_PORT
              value: "50059"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30  # Give more time for DB connections
            periodSeconds: 5
            timeoutSeconds: 5  # Increase timeout
            failureThreshold: 30  # More attempts
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem