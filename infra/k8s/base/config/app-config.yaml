apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  NODE_ENV: production
  ALLOW_MOCK_PASSKEY_DATA: "false"  # Production mode - requires real WebAuthn data (set to "true" for testing)
  WEBAUTHN_RP_ID: "record-platform.test"  # Relying Party ID (cold-bootstrap edge domain)
  WEBAUTHN_ORIGIN: "https://record-platform.test"  # WebAuthn origin (must match actual origin)
  
  # SMS Provider Configuration
  # Using Mock SMS Provider (FREE - like MailHog for email)
  # Perfect for development/testing - no external services needed
  # Access sent messages via: GET /api/auth/sms/mock/messages
  SMS_PROVIDER: "mock"  # Mock provider - FREE, works immediately, no setup needed
  SMS_USE_MOCK: "true"  # Force mock mode (FREE - logs to console, accessible via API)
  NEXT_PUBLIC_GATEWAY_URL: https://record-platform.test

  GATEWAY_PORT: "4000"
  AUTH_PORT: "4001"
  RECORDS_PORT: "4002"
  LISTINGS_PORT: "4012"
  ANALYTICS_PORT: "4017"
  AI_PORT: "5005"
  SHOPPING_PORT: "4007"

  # Redis via durable selectorless Service (EndpointSlice → Colima VM published port).
  # Transport: plaintext local-dev exception — ROUTING_PROVEN_SECURITY_GATE_STILL_OPEN for Redis TLS.
  REDIS_URL: redis://redis-external.record-platform.svc.cluster.local:6379/0

  PROTO_ROOT: /app/proto

  # EXTERNAL Postgres — one Service DNS name per published instance (not a single generic PG Service).
  # Reconciler: scripts/reconcile-external-endpoints.sh. TLS: STRICT_TLS_REQUIRED_NOT_YET_PROVEN.
  DATABASE_URL:         postgresql://postgres:postgres@postgres-records-external.record-platform.svc.cluster.local:5433/records?connect_timeout=5

  # optional compatibility (literal duplicates, not $(…))
  POSTGRES_URL:         postgresql://postgres:postgres@postgres-records-external.record-platform.svc.cluster.local:5433/records?connect_timeout=5
  POSTGRES_URL_AUTH:    postgresql://postgres:postgres@postgres-auth-external.record-platform.svc.cluster.local:5437/auth?connect_timeout=5
  POSTGRES_URL_RECORDS: postgresql://postgres:postgres@postgres-records-external.record-platform.svc.cluster.local:5433/records?connect_timeout=10
  # Database port mappings (Service port = Colima published port):
  # Python AI DB: 5440
  # Analytics DB: 5439
  # Listings DB: 5435
  POSTGRES_URL_LISTINGS: postgresql://postgres:postgres@postgres-listings-external.record-platform.svc.cluster.local:5435/listings?connect_timeout=5
  # Shopping service: port 5436, database "shopping"
  POSTGRES_URL_SHOPPING: postgresql://postgres:postgres@postgres-shopping-external.record-platform.svc.cluster.local:5436/shopping?connect_timeout=5
  POSTGRES_URL_AUCTION_MONITOR: postgresql://postgres:postgres@postgres-auction-monitor-core-external.record-platform.svc.cluster.local:5438/postgres?connect_timeout=5
  POSTGRES_URL_ANALYTICS: postgresql://postgres:postgres@postgres-analytics-external.record-platform.svc.cluster.local:5439/analytics?connect_timeout=10
  # NOTE: asyncpg doesn't support connect_timeout parameter - removed for Python AI service
  POSTGRES_URL_PYTHON_AI: postgresql://postgres:postgres@postgres-python-ai-external.record-platform.svc.cluster.local:5440/python_ai
  POSTGRES_URL_MESSAGING: postgresql://postgres:postgres@postgres-messaging-external.record-platform.svc.cluster.local:5434/messaging?connect_timeout=5
  POSTGRES_URL_NOTIFICATION: postgresql://postgres:postgres@postgres-notification-external.record-platform.svc.cluster.local:5441/notification?connect_timeout=5
  POSTGRES_URL_TRUST: postgresql://postgres:postgres@postgres-trust-external.record-platform.svc.cluster.local:5442/trust?connect_timeout=5
  POSTGRES_URL_MEDIA: postgresql://postgres:postgres@postgres-media-external.record-platform.svc.cluster.local:5443/media?connect_timeout=5

  # MinIO (Compose in default Colima) via minio-external Service DNS
  S3_ENDPOINT: http://minio-external.record-platform.svc.cluster.local:9000
  S3_BUCKET: record-media
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "true"
  S3_USE_SSL: "false"
  # In-cluster Ollama (analytics listing-feel). Override in dev overlay for host Metal.
  OLLAMA_BASE_URL: http://ollama.record-platform.svc.cluster.local:11434
  OLLAMA_MODEL: llama3.2:1b
  OLLAMA_WARM_MARKER_PATH: /var/ollama-warm/model-warmed
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_MAX_QUEUE: "4"
  OLLAMA_KEEP_ALIVE: "5m"
  OLLAMA_LOAD_TIMEOUT: "10m"

  # Kafka: strict TLS only (no plaintext/cleartext). All client connections use port 9093 (SSL).
  # Broker PLAINTEXT is bound to 127.0.0.1 only (healthcheck); clients must use SSL.
  # Required when KAFKA_SSL_ENABLED=true: set KAFKA_CA_CERT to path to CA PEM (e.g. kafka-ssl-secret).
  # Optional mTLS: KAFKA_CLIENT_CERT, KAFKA_CLIENT_KEY. Mount certs via Secret and set env in deployment.
  # KRaft 3-broker bootstrap (INTERNAL SSL :9093 on headless kafka-N.kafka). Comma-separated — services/common kafka.ts splits on ','.
  KAFKA_BROKER: kafka-0.kafka.record-platform.svc.cluster.local:9093,kafka-1.kafka.record-platform.svc.cluster.local:9093,kafka-2.kafka.record-platform.svc.cluster.local:9093
  KAFKA_USE_SSL: "true"
  KAFKA_SSL_ENABLED: "true"
