apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  JWT_SECRET: change_me_super_secret

  # Redis password (matches redis-auth secret)
  REDIS_PASSWORD: SUPER_STRONG_REDIS_PASSWORD

  # Optional integrations – leave blank or fill in
  DISCOGS_CONSUMER_KEY: ""
  DISCOGS_CONSUMER_SECRET: ""
  DISCOGS_TOKEN: ""
  EBAY_CLIENT_ID: ""
  EBAY_CLIENT_SECRET: ""
  EBAY_OAUTH_TOKEN: ""

  # S3/R2
  S3_ENDPOINT: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""

  # Auth Service - OAuth, MFA, Verification
  # Google OAuth (required for OAuth features)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_CALLBACK_URL: "http://localhost:4001/auth/google/callback"
  FRONTEND_URL: "http://localhost:3001"

  # SMTP for Email Verification (optional)
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""

  # Twilio for SMS Verification (optional)
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM_NUMBER: ""
