apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: record-platform
resources:
  - app-config.yaml
  - app-secrets.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: proto-files
    files:
      # Synced via scripts/sync-proto-to-k8s.sh before apply
      - common.proto=proto/common.proto
      - health.proto=proto/health.proto
      - auth.proto=proto/auth.proto
      - records.proto=proto/records.proto
      - listings.proto=proto/listings.proto
      - shopping.proto=proto/shopping.proto
      - messaging.proto=proto/messaging.proto
      - media.proto=proto/media.proto
      - notification.proto=proto/notification.proto
      - trust.proto=proto/trust.proto
      - analytics.proto=proto/analytics.proto
      - auction-monitor.proto=proto/auction-monitor.proto
      - python-ai.proto=proto/python-ai.proto
      - social.proto=proto/social.proto
