syntax = "proto3";

package events.media;

option go_package = "github.com/TomWang22/record-platform/proto/events/media";

// Emitted by media-service to ${ENV_PREFIX}.media.events after successful upload. No bytes in event.
message AssetUploadedV1 {
  string media_id = 1;
  string user_id = 2;
  string content_type = 3;
  string uploaded_at = 4;
}

message AssetAttachedV1 {
  string media_id = 1;
  string parent_type = 2;
  string parent_id = 3;
  string attached_at = 4;
}

message AssetDeletedV1 {
  string media_id = 1;
  string deleted_at = 2;
}

message ScanCompletedV1 {
  string media_id = 1;
  string scan_status = 2;
  string completed_at = 3;
}

// Legacy alias
message MediaUploadedV1 {
  string media_id = 1;
  string user_id = 2;
  string content_type = 3;
  string uploaded_at = 4;
}
