# Before first apply: ./scripts/install-prometheus-operator-crds.sh (ServiceMonitor/PodMonitor CRDs).
# On k3d after apply: patch app images to registry, e.g. ./scripts/push-dev-images-to-registry.sh then
#   for d in api-gateway auth-service records-service listings-service analytics-service python-ai-service messaging-service trust-service media-service notification-service shopping-service auction-monitor webapp ollama; do kubectl set image deploy/$d -n record-platform app=k3d-record-platform-registry:5000/$d:dev; done
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml           # ensure namespaces exist first
  - config                    # configmaps (app-config, proto-files)
  - secrets                   # TLS/CA secrets (service-tls, dev-root-ca)
  # - postgres                # Permanently externalized: all DBs via host.docker.internal (Docker Compose)
  # - pgbouncer               # Disabled for direct DB tuning
  - redis
  # - zookeeper               # External Kafka only: Docker Compose ZK
  # - kafka                   # External Kafka only: Docker Compose :29092
  - kafka-external
  - exporters
  - monitoring
  - observability
  - haproxy
  - nginx
  - api-gateway
  - auth-service
  - records-service
  - listings-service
  - analytics-service
  - python-ai-service
  - messaging-service
  - trust-service
  - media-service
  - notification-service
  - shopping-service
  - auction-monitor
  - ollama
  - webapp
  - envoy-test                # Envoy gRPC proxy (port 10000)
  # - cron-jobs              # Temporarily disabled - k6 files missing
