apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml           # ensure namespaces exist first
  - config                    # configmaps (app-config, proto-files)
  - secrets                   # TLS/CA secrets (service-tls, dev-root-ca)
  - postgres
  # - pgbouncer               # Disabled for direct DB tuning
  - redis
  - zookeeper
  - kafka
  - exporters
  - monitoring
  - observability
  - haproxy
  - nginx
  - api-gateway
  - auth-service
  - records-service
  - listings-service
  - analytics-service
  - python-ai-service
  - social-service
  - shopping-service
  - auction-monitor
  - envoy-test                # Envoy gRPC proxy (port 10000)
  # - cron-jobs              # Temporarily disabled - k6 files missing
  # - webapp                 # Webapp frontend (port 3001) - excluded as requested (externalized)
