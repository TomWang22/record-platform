apiVersion: apps/v1
kind: Deployment
metadata:
  name: listings-service
  namespace: record-platform
  labels: { app: listings-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: listings-service } }
  template:
    metadata:
      labels: { app: listings-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: listings-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4003
            - name: grpc
              containerPort: 50057
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: GRPC_PORT
              value: "50057"
            - name: ENABLE_GRPC
              value: "true"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: proto-files
          configMap:
            name: proto-files