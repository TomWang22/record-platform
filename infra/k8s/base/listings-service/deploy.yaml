apiVersion: apps/v1
kind: Deployment
metadata:
  name: listings-service
  namespace: record-platform
  labels: { app: listings-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: listings-service } }
  template:
    metadata:
      labels: { app: listings-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: listings-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4003
            - name: grpc
              containerPort: 50057
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: GRPC_PORT
              value: "50057"
            - name: ENABLE_GRPC
              value: "true"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
          # gRPC Health Checks (grpc.health.v1.Health/Check) - HTTP/2/3 only, NOT HTTP/1.1
          # Uses grpc-health-probe binary for standard gRPC health checking protocol
          # Protocol: HTTP/2 (h2) with TLS or HTTP/3 (QUIC) - Strict TLS, production-ready
          # Service name: listings.ListingsService (registered service name)
          # Uses TLS with CA certificate for strict verification
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50057
                - -service=listings.ListingsService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=5s
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 20
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50057
                - -service=listings.ListingsService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=5s
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 20
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50057
                - -service=listings.ListingsService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=10s
                - -rpc-timeout=15s
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 20
            failureThreshold: 30
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt