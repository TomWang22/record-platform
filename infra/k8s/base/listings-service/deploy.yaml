apiVersion: apps/v1
kind: Deployment
metadata:
  name: listings-service
  namespace: record-platform
  labels: { app: listings-service }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: listings-service } }
  template:
    metadata:
      labels: { app: listings-service }
      annotations:
        rp.dev/kafka-client-leaf-sha256: "CF:50:E0:A5:CD:E8:0D:E3:57:A5:7F:8F:98:5B:5D:6F:AA:D5:71:60:2D:18:8B:0F:72:73:F3:98:6E:5B:EE:BB"
        prometheus.io/scrape: "true"
        prometheus.io/port: "4012"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-db
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              for i in $(seq 1 60); do
                nc -zv postgres-listings-external.record-platform.svc.cluster.local 5435 2>/dev/null && exit 0
                sleep 2
              done
              echo "Listings DB (5435) unreachable; ensure Compose Postgres up and external EndpointSlices reconciled (see docs/COLIMA_POD_STABILITY_AND_HOST_ALIASES.md)"
              exit 1
      containers:
        - name: app
          image: listings-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4012
            - name: grpc
              containerPort: 50062
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: GRPC_PORT
              value: "50062"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"  # Strict mTLS: Envoy presents client cert to backends
            - name: TLS_CA_PATH
              value: "/etc/certs/ca.crt"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/client/ca-chain.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/client/tls.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/client/tls.key"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-client-tls
              mountPath: /etc/kafka/client
              readOnly: true

      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls-listings-service
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-client-tls
          secret:
            secretName: kafka-client-tls-listings-service
            defaultMode: 420
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
            - key: ca-chain.pem
              path: ca-chain.pem
