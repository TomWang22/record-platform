apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: record-platform
  labels: { app: media-service }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector: { matchLabels: { app: media-service } }
  template:
    metadata:
      labels: { app: media-service }
      annotations:
        prometheus.io/scrape: "true"
        # /metrics is served on HTTP port 4018 (50068 is gRPC).
        prometheus.io/port: "4018"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-kafka-tcp
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
                  optional: true
          command: ["sh", "-c"]
          args:
            - |
              set -e
              targets="${KAFKA_BROKER:-kafka-0.kafka-headless:9093,kafka-1.kafka-headless:9093,kafka-2.kafka-headless:9093}"
              targets="${targets},kafka-0.kafka:9093,kafka-1.kafka:9093,kafka-2.kafka:9093,kafka-0:9093,kafka-0:9092"
              echo "[wait-kafka-tcp] probing Kafka endpoints: $targets"
              i=0
              while [ "$i" -lt 360 ]; do
                IFS=','; for endpoint in $targets; do
                  host="${endpoint%%:*}"
                  port="${endpoint##*:}"
                  if [ "$port" = "$host" ]; then port=9093; fi
                  if nc -z "$host" "$port" 2>/dev/null; then
                    echo "[wait-kafka-tcp] ok via $host:$port"
                    exit 0
                  fi
                done
                unset IFS
                i=$((i+1))
                sleep 5
              done
              echo "[wait-kafka-tcp] timeout after probing: $targets"
              exit 1
      containers:
        - name: app
          image: media-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4018
            - name: grpc
              containerPort: 50068
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: OTEL_SERVICE_NAME
              value: "media-service"
            - name: GRPC_PORT
              value: "50068"
            - name: HTTP_PORT
              value: "4018"
            - name: MEDIA_DB_PORT
              value: "5443"
            - name: MEDIA_DB_NAME
              value: "media"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"
            - name: TLS_CA_PATH
              value: "/etc/certs/ca.crt"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/secrets/ca-cert.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/secrets/client.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/secrets/client.key"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-ssl
              mountPath: /etc/kafka/secrets
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Startup must NOT use grpc.health Check with DB — NOT_SERVING while Postgres warms up looks like a crash loop (kubelet restarts the container).
          # TCP only: gRPC+mTLS listener is accepting connections.

      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: service-tls
          secret:
            secretName: service-tls-media-service
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-ssl
          secret:
            secretName: kafka-ssl-secret
            optional: true
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
