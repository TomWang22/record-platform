# Messaging service: HTTP 4014, gRPC 50064, RP messaging DB host port 5434.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service
  namespace: record-platform
  labels:
    app: messaging-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: messaging-service
  template:
    metadata:
      labels:
        app: messaging-service
      annotations:
        rp.dev/kafka-client-leaf-sha256: "3D:AB:C6:78:90:C0:EB:65:4C:C1:B6:21:91:61:C5:C3:20:71:54:01:62:09:1F:F9:AD:D2:41:2D:85:79:78:7F"
        prometheus.io/scrape: "true"
        prometheus.io/port: "4014"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-kafka-tcp
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
                  optional: true
          command: ["sh", "-c"]
          args:
            - |
              set -e
              targets="${KAFKA_BROKER:-kafka-0.kafka-headless:9093,kafka-1.kafka-headless:9093,kafka-2.kafka-headless:9093}"
              targets="${targets},kafka-0.kafka:9093,kafka-1.kafka:9093,kafka-2.kafka:9093,kafka-0:9093,kafka-0:9092"
              echo "[wait-kafka-tcp] probing Kafka endpoints: $targets"
              i=0
              while [ "$i" -lt 360 ]; do
                IFS=','; for endpoint in $targets; do
                  host="${endpoint%%:*}"
                  port="${endpoint##*:}"
                  if [ "$port" = "$host" ]; then port=9093; fi
                  if nc -z "$host" "$port" 2>/dev/null; then
                    echo "[wait-kafka-tcp] ok via $host:$port"
                    exit 0
                  fi
                done
                unset IFS
                i=$((i+1))
                sleep 5
              done
              echo "[wait-kafka-tcp] timeout after probing: $targets"
              exit 1
      containers:
        - name: app
          image: messaging-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4014
            - name: grpc
              containerPort: 50064

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets

          env:
            - name: NODE_ENV
              value: "development"
            - name: OTEL_SERVICE_NAME
              value: "messaging-service"
            - name: HTTP_PORT
              value: "4014"
            - name: GRPC_PORT
              value: "50064"
            - name: ENABLE_GRPC
              value: "true"
            - name: POSTGRES_URL_MESSAGING
              value: "postgresql://postgres:postgres@postgres-messaging-external.record-platform.svc.cluster.local:5434/messaging?connect_timeout=5"
            - name: LISTINGS_HTTP
              value: "http://listings-service:4012"
            - name: NOTIFICATION_HTTP
              value: "http://notification-service.record-platform.svc.cluster.local:4015"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"
            - name: TLS_CA_PATH
              value: "/etc/certs/ca.crt"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: KAFKA_USE_SSL
              value: "true"
            - name: KAFKA_SSL_ENABLED
              value: "true"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/client/ca-chain.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/client/tls.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/client/tls.key"
            - name: MESSAGING_HTTP_MAX_CONCURRENT
              value: "200"

          volumeMounts:
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-client-tls
              mountPath: /etc/kafka/client
              readOnly: true

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

      volumes:
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem

        - name: service-tls
          secret:
            secretName: service-tls-messaging-service
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt

        - name: kafka-client-tls
          secret:
            secretName: kafka-client-tls-messaging-service
            defaultMode: 420
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
            - key: ca-chain.pem
              path: ca-chain.pem
