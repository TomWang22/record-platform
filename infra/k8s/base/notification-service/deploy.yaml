apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: record-platform
  labels:
    app: notification-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        rp.dev/kafka-client-leaf-sha256: "99:95:7B:1F:AB:FD:66:1E:74:BE:4B:DE:8C:93:AC:BC:92:B6:01:41:F7:16:7B:AA:C3:7C:8C:0E:85:36:1E:AF"
        prometheus.io/scrape: "true"
        prometheus.io/port: "4015"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-kafka-tcp
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
                  optional: true
          command: ["sh", "-c"]
          args:
            - |
              set -e
              targets="${KAFKA_BROKER:-kafka-0.kafka-headless:9093,kafka-1.kafka-headless:9093,kafka-2.kafka-headless:9093}"
              targets="${targets},kafka-0.kafka:9093,kafka-1.kafka:9093,kafka-2.kafka:9093,kafka-0:9093,kafka-0:9092"
              echo "[wait-kafka-tcp] probing Kafka endpoints: $targets"
              i=0
              while [ "$i" -lt 360 ]; do
                IFS=','; for endpoint in $targets; do
                  host="${endpoint%%:*}"
                  port="${endpoint##*:}"
                  if [ "$port" = "$host" ]; then port=9093; fi
                  if nc -z "$host" "$port" 2>/dev/null; then
                    echo "[wait-kafka-tcp] ok via $host:$port"
                    exit 0
                  fi
                done
                unset IFS
                i=$((i+1))
                sleep 5
              done
              echo "[wait-kafka-tcp] timeout after probing: $targets"
              exit 1
      containers:
        - name: app
          image: notification-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4015
            - name: grpc
              containerPort: 50065
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: NODE_ENV
              value: "development"
            - name: OTEL_SERVICE_NAME
              value: "notification-service"
            - name: HTTP_PORT
              value: "4015"
            - name: GRPC_PORT
              value: "50065"
            - name: NOTIFICATION_E2E_SEED
              value: "0"
            - name: POSTGRES_URL_NOTIFICATION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_URL_NOTIFICATION
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"
            - name: TLS_CA_PATH
              value: "/etc/certs/ca.crt"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: KAFKA_USE_SSL
              value: "true"
            - name: KAFKA_SSL_ENABLED
              value: "true"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/client/ca-chain.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/client/tls.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/client/tls.key"
          volumeMounts:
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-client-tls
              mountPath: /etc/kafka/client
              readOnly: true
          # Startup / liveness: TCP only (gRPC+mTLS listener up). gRPC health includes DB — NOT_SERVING or Kafka
          # stalls during coordinator migration caused restart storms + SIGTERM → consumer disconnect + exit 0.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: service-tls
          secret:
            secretName: service-tls-notification-service
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-client-tls
          secret:
            secretName: kafka-client-tls-notification-service
            defaultMode: 420
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
            - key: ca-chain.pem
              path: ca-chain.pem
