apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ai-service
  namespace: record-platform
  labels: { app: python-ai-service }
spec:
  replicas: 2  # Keep two pods (social + pipeline)
  selector: { matchLabels: { app: python-ai-service } }
  template:
    metadata:
      labels: { app: python-ai-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5005"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: python-ai-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5005
            - name: grpc
              containerPort: 50060
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_PORT
              value: "50060"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: KAFKA_SSL_CA_CERT
              value: "/etc/kafka/secrets/ca-cert.pem"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-ssl-certs
              mountPath: /etc/kafka/secrets
              readOnly: true
          # gRPC Health Checks (grpc.health.v1.Health/Check) - HTTP/2 only
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50060
                - -service=grpc.health.v1.Health
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 35
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50060
                - -service=grpc.health.v1.Health
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 35
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50060
                - -service=grpc.health.v1.Health
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 35
            failureThreshold: 30
          resources:
            requests:
              cpu: "1000m"  # Increased from 500m (1 CPU core) for better baseline performance
              memory: "1Gi"  # Increased from 512Mi for better caching and connection pools
            limits:
              cpu: "4"  # Increased from 2 (2 CPU cores) to 4 for better concurrency under load
              memory: "4Gi"  # Increased from 2Gi to 4Gi for better caching and connection pools
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
        - name: kafka-ssl-certs
          secret:
            secretName: kafka-ssl-secret
            optional: true  # Optional for dev (can use PLAINTEXT if not available)