apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ai-service
  namespace: record-platform
  labels: { app: python-ai-service }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: python-ai-service } }
  template:
    metadata:
      labels: { app: python-ai-service }
      annotations:
        rp.dev/kafka-client-leaf-sha256: "8B:B4:B0:34:64:B5:C3:45:06:BC:9C:43:0E:CC:C2:26:4F:C3:AA:5A:69:5A:50:DC:B2:C3:29:AD:5F:6A:44:65"
        prometheus.io/scrape: "true"
        prometheus.io/port: "5005"
        prometheus.io/path: "/metrics"
    spec:
      hostAliases:
        - ip: "192.168.5.2"
          hostnames:
            - "host.docker.internal"
            - "host.lima.internal"
      initContainers:
        - name: wait-db
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              for i in $(seq 1 60); do
                nc -zv host.docker.internal 5440 2>/dev/null && exit 0
                sleep 2
              done
              echo "Python AI DB (5440) unreachable; ensure Postgres up and ./scripts/colima-apply-host-aliases.sh if on Colima (see docs/COLIMA_POD_STABILITY_AND_HOST_ALIASES.md)"
              exit 1
      containers:
        - name: app
          image: python-ai-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5005
            - name: grpc
              containerPort: 50060
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"  # Strict mTLS: Envoy presents client cert to backends
            - name: TLS_CA_PATH
              value: "/etc/certs/ca.crt"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
            - name: GRPC_PORT
              value: "50060"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: KAFKA_SSL_CA_CERT
              value: "/etc/kafka/client/ca-chain.pem"
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_SSL
              value: "true"
            - name: KAFKA_SSL_ENABLED
              value: "true"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/client/ca-chain.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/client/tls.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/client/tls.key"
            # Explicit POSTGRES_URL_PYTHON_AI (belt-and-suspenders with envFrom; ensures pool can connect)
            - name: POSTGRES_URL_PYTHON_AI
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_URL_PYTHON_AI }
            # T15.2E — RAG readiness (OLLAMA_BASE_URL from app-config via envFrom)
            - name: AI_RAG_MAX_CHUNKS
              value: "8"
            - name: AI_RAG_MAX_CONTEXT_TOKENS
              value: "2048"
            - name: AI_OLLAMA_TIMEOUT_MS
              value: "2000"
            - name: AI_OLLAMA_MODEL
              value: "llama3.2:1b"
            - name: AI_EMBEDDING_MODEL
              value: "nomic-embed-text"
            - name: AI_MODEL_PROVIDER
              value: "rule"
            - name: AI_MAX_RESPONSE_TOKENS
              value: "512"
            - name: AI_TRANSFORMER_ENABLED
              value: "0"
            # T20.10H — cap gunicorn workers (preload_app + grpc/kafka per worker is memory-heavy)
            - name: WEB_CONCURRENCY
              value: "4"
            - name: RP_SERVICE_NAME
              value: "python-ai-service"
            - name: RP_KAFKA_CLIENT_ID_STRICT
              value: "1"
            - name: RP_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RP_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-client-tls
              mountPath: /etc/kafka/client
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls-python-ai-service
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-client-tls
          secret:
            secretName: kafka-client-tls-python-ai-service
            defaultMode: 420
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
            - key: ca-chain.pem
              path: ca-chain.pem
