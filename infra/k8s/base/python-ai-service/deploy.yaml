apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ai-service
  namespace: record-platform
  labels: { app: python-ai-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: python-ai-service } }
  template:
    metadata:
      labels: { app: python-ai-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5005"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: python-ai-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5005
            - name: grpc
              containerPort: 50060
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_PORT
              value: "50060"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
      volumes:
        - name: proto-files
          configMap:
            name: proto-files