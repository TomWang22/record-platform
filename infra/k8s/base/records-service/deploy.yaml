apiVersion: apps/v1
kind: Deployment
metadata:
  name: records-service
  namespace: record-platform
  labels: { app: records-service }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: records-service } }
  template:
    metadata:
      labels: { app: records-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4002"
        prometheus.io/path: "/metrics"
    spec:
      hostAliases:
        - ip: "192.168.5.2"
          hostnames:
            - "host.docker.internal"
            - "host.lima.internal"
      containers:
        - name: app
          image: records-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4002
            - name: grpc
              containerPort: 50051
          # Load base config first; explicit env below overrides these.
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            # REDIS_URL comes from app-config ConfigMap (redis-external)
            - name: CACHE_TTL_MS_SHORT
              value: "15000"
            - name: CACHE_TTL_MS_LONG
              value: "60000"
            - name: GRPC_PORT
              value: "50051"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"  # Strict mTLS: Envoy presents client cert to backends
            - name: TLS_CA_PATH
              value: "/etc/certs/ca.crt"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/secrets/ca-cert.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/secrets/client.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/secrets/client.key"
            # Use external Docker Postgres (port 5433) as per run_pgbench_sweep.sh reference
            # DATABASE_URL from app-config.yaml is already set correctly to host.docker.internal:5433
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: tls-certs
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-ssl-certs
              mountPath: /etc/kafka/secrets
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: tls-certs
          secret:
            secretName: service-tls-records-service
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-ssl-certs
          secret:
            secretName: kafka-ssl-secret
            optional: true
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
