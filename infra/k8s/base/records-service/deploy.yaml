apiVersion: apps/v1
kind: Deployment
metadata:
  name: records-service
  namespace: record-platform
  labels: { app: records-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: records-service } }
  template:
    metadata:
      labels: { app: records-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: records-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4002
            - name: grpc
              containerPort: 50051
          # Load base config first; explicit env below overrides these.
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: REDIS_URL
              value: "redis://redis.record-platform.svc.cluster.local:6379"
            - name: CACHE_TTL_MS_SHORT
              value: "15000"
            - name: CACHE_TTL_MS_LONG
              value: "60000"
            - name: GRPC_PORT
              value: "50051"
            - name: ENABLE_GRPC
              value: "true"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            # Use external Docker Postgres (port 5433) as per run_pgbench_sweep.sh reference
            # DATABASE_URL from app-config.yaml is already set correctly to host.docker.internal:5433
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: tls-certs
              mountPath: /etc/certs
              readOnly: true
          # gRPC Health Checks (grpc.health.v1.Health/Check) - HTTP/2 only
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50051
                - -service=records.RecordsService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 35
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50051
                - -service=records.RecordsService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 35
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50051
                - -service=records.RecordsService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=30s
                - -rpc-timeout=30s
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 35
            failureThreshold: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: tls-certs
          secret:
            secretName: service-tls
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
