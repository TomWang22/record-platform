apiVersion: apps/v1
kind: Deployment
metadata:
  name: records-service
  namespace: record-platform
  labels: { app: records-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: records-service } }
  template:
    metadata:
      labels: { app: records-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: records-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4002
            - name: grpc
              containerPort: 50051
          # Load base config first; explicit env below overrides these.
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: REDIS_URL
              value: "redis://redis.record-platform.svc.cluster.local:6379"
            - name: CACHE_TTL_MS_SHORT
              value: "15000"
            - name: CACHE_TTL_MS_LONG
              value: "60000"
            - name: GRPC_PORT
              value: "50051"
            - name: ENABLE_GRPC
              value: "true"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            # Use external Docker Postgres (port 5433) as per run_pgbench_sweep.sh reference
            # DATABASE_URL from app-config.yaml is already set correctly to host.docker.internal:5433
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet: { path: /_ping, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /_ping, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /_ping, port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
