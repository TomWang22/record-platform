# Service for external Redis (Docker Compose :6379 on the host gateway).
# Endpoints are NOT in git — patch after apply with the pod-routable gateway IP (not 172.18.0.x bridge):
#   bash scripts/sync-redis-external-endpoints.sh
apiVersion: v1
kind: Service
metadata:
  name: redis-external
  namespace: record-platform
  labels:
    app: redis-external
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
