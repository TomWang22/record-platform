# Service for external Redis (Docker Compose :6379 on Colima VM published port).
# Endpoints/EndpointSlices are reconciled by scripts/reconcile-external-endpoints.sh
# (COLIMA_DEFAULT_DOCKER_CONTAINER → profile VM address — not macOS gateway).
apiVersion: v1
kind: Service
metadata:
  name: redis-external
  namespace: record-platform
  labels:
    app: redis-external
    rp.external-dependency: "true"
    rp.dependency-name: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
