apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: record-platform

resources:
  - deploy.yaml
  - service.yaml
  - external-service.yaml  # External Service/Endpoint for Docker Compose Redis

configMapGenerator:
  - name: redis-config
    files:
      - redis.conf=config/redis.conf

generatorOptions:
  disableNameSuffixHash: true