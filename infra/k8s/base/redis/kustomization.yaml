# Redis: external only (Docker Compose). In-cluster deploy/service removed.
# Uses redis-external Service+Endpoints; reconcile with scripts/reconcile-external-endpoints.sh.
# App-config REDIS_URL uses redis-external.record-platform.svc.cluster.local.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: record-platform

resources:
  - external-service.yaml