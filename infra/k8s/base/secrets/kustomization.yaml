apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: record-platform

generatorOptions:
  disableNameSuffixHash: true

# Use type Opaque so apply can update the secret when it was previously created as generic (e.g. by ensure-strict-tls-mtls-preflight.sh). kubernetes.io/tls is immutable and blocks apply.
secretGenerator:
  - name: service-tls
    files:
      - tls.crt=certs/record.local.crt
      - tls.key=certs/record.local.key
      - ca.crt=certs/dev-root.pem
  - name: dev-root-ca
    files:
      - dev-root.pem=certs/dev-root.pem
  # kafka-ssl-secret: NOT here — kustomize would overwrite JKS + client mTLS with ca-cert.pem only.
  # Canonical writer: scripts/apply-rp-kafka-ssl-secret.sh (after kafka-ssl-from-dev-root.sh / P5b refresh).
