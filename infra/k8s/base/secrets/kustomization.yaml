apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: record-platform

generatorOptions:
  disableNameSuffixHash: true

# service-tls + edge-service-tls: NOT here — kustomize would overwrite leaf+intermediate chains
# with stale record.local.crt (single cert). Canonical writers: B.crypto strict-tls-bootstrap /
# scripts/lib/rp-apply-service-mtls-secrets.sh (re-applied after P6a in rp-apply-rp-app-manifests.sh).
secretGenerator:
  - name: dev-root-ca
    files:
      - dev-root.pem=certs/dev-root.pem
  # kafka-ssl-secret: NOT here — kustomize would overwrite JKS + client mTLS with ca-cert.pem only.
  # Canonical writer: scripts/apply-rp-kafka-ssl-secret.sh (after kafka-ssl-from-dev-root.sh / P5b refresh).
