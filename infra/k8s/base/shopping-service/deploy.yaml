apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-service
  namespace: record-platform
  labels: { app: shopping-service }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: shopping-service } }
  template:
    metadata:
      labels: { app: shopping-service }
      annotations:
        rp.dev/kafka-client-leaf-sha256: "C5:80:35:A4:D8:ED:78:AE:90:81:7E:F8:7C:31:5F:DC:A2:89:E7:C3:EF:EA:83:D2:3C:5C:DF:66:7C:B8:F6:05"
        prometheus.io/scrape: "true"
        prometheus.io/port: "4007"
        prometheus.io/path: "/metrics"
    spec:
      # Colima/k3s: pods do not resolve host.docker.internal; alias to VM host gateway so externalized Redis/Postgres (Docker Compose) are reachable.
      # Default Lima/Colima host IP is 192.168.5.2. Override with a Colima overlay if your network uses a different gateway (e.g. 192.168.106.1).
      hostAliases:
        - ip: "192.168.5.2"
          hostnames:
            - "host.docker.internal"
            - "host.lima.internal"
      containers:
        - name: app
          image: shopping-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4007
            - name: grpc
              containerPort: 50058
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: SHOPPING_PORT
              value: "4007"
            - name: GRPC_PORT
              value: "50058"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "true"  # Strict mTLS: Envoy presents client cert to backends
            - name: TLS_CA_PATH
              value: "/etc/certs/ca.crt"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_SSL
              value: "true"
            - name: KAFKA_SSL_ENABLED
              value: "true"
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/client/ca-chain.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/client/tls.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/client/tls.key"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
            - name: kafka-client-tls
              mountPath: /etc/kafka/client
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi

      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls-shopping-service
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
              - key: ca.crt
                path: ca.crt
        - name: kafka-client-tls
          secret:
            secretName: kafka-client-tls-shopping-service
            defaultMode: 420
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
            - key: ca-chain.pem
              path: ca-chain.pem
