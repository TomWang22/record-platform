apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-service
  namespace: record-platform
  labels: { app: shopping-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: shopping-service } }
  template:
    metadata:
      labels: { app: shopping-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4007"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: ghcr.io/yourorg/shopping-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4007
            - name: grpc
              containerPort: 50058
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: SHOPPING_PORT
              value: "4007"
            - name: GRPC_PORT
              value: "50058"
            - name: ENABLE_GRPC
              value: "true"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
      volumes:
        - name: proto-files
          configMap:
            name: proto-files

