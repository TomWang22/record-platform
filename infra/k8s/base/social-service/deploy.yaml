apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-service
  namespace: record-platform
  labels: { app: social-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: social-service } }
  template:
    metadata:
      labels: { app: social-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4006"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: social-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4006
            - name: grpc
              containerPort: 50056
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: SOCIAL_PORT
              value: "4006"
            - name: GRPC_PORT
              value: "50056"
            - name: ENABLE_GRPC
              value: "true"
            - name: GRPC_REQUIRE_CLIENT_CERT
              value: "false"  # Disable client cert verification for dev (like auth-service)
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
          startupProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50056
                - -service=social.SocialService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=10s
                - -rpc-timeout=15s
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 40
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50056
                - -service=social.SocialService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=5s
                - -rpc-timeout=5s
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=localhost:50056
                - -service=social.SocialService
                - -tls
                - -tls-no-verify=false
                - -tls-ca-cert=/etc/certs/ca.crt
                - -tls-client-cert=/etc/certs/tls.crt
                - -tls-client-key=/etc/certs/tls.key
                - -tls-server-name=record.local
                - -connect-timeout=5s
                - -rpc-timeout=5s
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls

