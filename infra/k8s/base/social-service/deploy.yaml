apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-service
  namespace: record-platform
  labels: { app: social-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: social-service } }
  template:
    metadata:
      labels: { app: social-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4006"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: social-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4006
            - name: grpc
              containerPort: 50056
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          env:
            - name: NODE_ENV
              value: "development"
            - name: SOCIAL_PORT
              value: "4006"
            - name: GRPC_PORT
              value: "50056"
            - name: ENABLE_GRPC
              value: "true"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/dev-root.pem"
          volumeMounts:
            - name: proto-files
              mountPath: /app/proto
              readOnly: true
            - name: dev-root-ca
              mountPath: /certs
              readOnly: true
            - name: service-tls
              mountPath: /etc/certs
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20  # Give more time for DB connections
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5  # More attempts
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: proto-files
          configMap:
            name: proto-files
        - name: dev-root-ca
          secret:
            secretName: dev-root-ca
            items:
              - key: dev-root.pem
                path: dev-root.pem
        - name: service-tls
          secret:
            secretName: service-tls

