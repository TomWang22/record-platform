# FILE: k8s/caddy-h3-deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-h3
  namespace: ingress-nginx
spec:
  # NOTE: Using Recreate strategy for now to get it working
  # For CA rotation with 2 replicas, we'll need to handle port conflicts differently
  strategy: { type: Recreate }
  replicas: 1
  selector: { matchLabels: { app: caddy-h3 } }
  template:
    metadata: { labels: { app: caddy-h3 } }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30  # Longer grace period for graceful shutdown
      # Pod anti-affinity: prefer pods on different nodes (but allow same node if needed)
      # With hostNetwork, only 1 pod per node can bind to port 443
      # Using "preferred" instead of "required" allows scheduling even if only 1 node available
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - caddy-h3
              topologyKey: kubernetes.io/hostname
      containers:
      - name: caddy
        image: caddy:2.8
        # root needed to bind 443; only CAP_NET_BIND_SERVICE elevated
        securityContext:
          runAsNonRoot: false
          capabilities: { add: ["NET_BIND_SERVICE"] }
        ports:
        - { name: https, containerPort: 443, protocol: TCP }
        - { name: https-udp, containerPort: 443, protocol: UDP }
        - { name: grpc-h2c, containerPort: 5000, protocol: TCP }
        volumeMounts:
        - { name: caddy-conf,  mountPath: /etc/caddy }                       # Caddyfile
        - { name: caddy-certs, mountPath: /etc/caddy/certs, readOnly: true } # tls.crt,tls.key
        - { name: caddy-ca,    mountPath: /etc/caddy/ca,    readOnly: true } # dev-root.pem
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /_caddy/healthz
            port: 443
          periodSeconds: 5
          failureThreshold: 3
          initialDelaySeconds: 5
        livenessProbe:
          tcpSocket: { port: 443 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        # Graceful shutdown: drain connections before termination
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]  # Give time for connections to drain
      volumes:
      - name: caddy-conf
        configMap:
          name: caddy-h3
          items: [{ key: Caddyfile, path: Caddyfile }]
      - name: caddy-certs
        secret:
          secretName: record-local-tls
          items:
            - { key: tls.crt, path: tls.crt }
            - { key: tls.key, path: tls.key }
      - name: caddy-ca
        secret:
          secretName: dev-root-ca
          items:
            - { key: dev-root.pem, path: dev-root.pem }