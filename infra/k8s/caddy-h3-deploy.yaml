# FILE: k8s/caddy-h3-deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-h3
  namespace: ingress-nginx
spec:
  # RollingUpdate with maxUnavailable=0 ensures zero-downtime
  # Old pod stays up while new pod comes online
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Always have at least 1 pod available
      maxSurge: 1        # Allow 1 extra pod during update
  replicas: 2  # Two replicas for zero-downtime CA rotation
  selector: { matchLabels: { app: caddy-h3 } }
  template:
    metadata: { labels: { app: caddy-h3 } }
    spec:
      # Removed hostNetwork - using NodePort service instead
      # This allows multiple pods to run simultaneously
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30  # Longer grace period for graceful shutdown
      # Pod anti-affinity: prefer pods on different nodes for better HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - caddy-h3
              topologyKey: kubernetes.io/hostname
      containers:
      - name: caddy
        image: caddy:2.8
        # With NodePort, we don't need privileged ports, but Caddy needs write access
        # Caddy user (UID 1000) needs to write to /data/caddy and /config/caddy
        # We use runAsNonRoot: false but with minimal capabilities for security
        securityContext:
          runAsNonRoot: false
          runAsUser: 0  # Caddy image runs as root by default
          capabilities: { add: ["NET_BIND_SERVICE"] }
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        ports:
        - { name: https, containerPort: 443, protocol: TCP }
        - { name: https-udp, containerPort: 443, protocol: UDP }
        - { name: grpc-h2c, containerPort: 5000, protocol: TCP }
        - { name: admin, containerPort: 2019, protocol: TCP }
        volumeMounts:
        - { name: caddy-conf,  mountPath: /etc/caddy }                       # Caddyfile
        - { name: caddy-certs, mountPath: /etc/caddy/certs, readOnly: true } # tls.crt,tls.key
        - { name: caddy-ca,    mountPath: /etc/caddy/ca,    readOnly: true } # dev-root.pem
        # HTTP/3 (QUIC) on 443/UDP; tcpSocket validates TLS listener. /_caddy/healthz for explicit HTTP/3 checks.
        readinessProbe:
          tcpSocket: { port: 443 }
          periodSeconds: 2
          failureThreshold: 3
          initialDelaySeconds: 2
          timeoutSeconds: 1
        livenessProbe:
          tcpSocket: { port: 443 }
          initialDelaySeconds: 5  # Reduced from 10s to 5s (still safe, but faster)
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 1  # Faster timeout
        # Graceful shutdown: drain connections before termination
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]  # Give time for connections to drain
      volumes:
      - name: caddy-conf
        configMap:
          name: caddy-h3
          items: [{ key: Caddyfile, path: Caddyfile }]
      - name: caddy-certs
        secret:
          secretName: record-local-tls
          items:
            - { key: tls.crt, path: tls.crt }
            - { key: tls.key, path: tls.key }
      - name: caddy-ca
        secret:
          secretName: dev-root-ca
          items:
            - { key: dev-root.pem, path: dev-root.pem }