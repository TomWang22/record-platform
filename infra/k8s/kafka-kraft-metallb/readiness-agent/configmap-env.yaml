# FUTURE rollout only — DO NOT APPLY until Gate 5 A/B readiness comparison passes.
#
# Sidecar + probe replacement for kafka StatefulSet.
# Live file infra/k8s/kafka-kraft-metallb/statefulset.yaml must remain untouched
# until explicit authorization after A/B.

apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-readiness-agent-env
  namespace: record-platform
  labels:
    app: kafka-readiness-agent
    gate: gate5-pre-v10
data:
  HTTP_ADDR: "127.0.0.1:8099"
  POLL_INTERVAL: "5s"
  FRESHNESS_THRESHOLD: "30s"
  RECONNECT_GRACE: "60s"
  CHECK_TIMEOUT: "10s"
  BROKER_PORT: "9093"
  # PEM paths after init conversion from /etc/kafka/secrets JKS
  TLS_CERT_FILE: "/etc/kafka/pem/tls.crt"
  TLS_KEY_FILE: "/etc/kafka/pem/tls.key"
  TLS_CA_FILE: "/etc/kafka/pem/ca.pem"
---
