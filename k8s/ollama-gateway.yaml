# Source-built ollama-gateway image (exact-SHA pin participant).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gateway
  namespace: record-platform
  labels:
    app: ollama-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-gateway
  template:
    metadata:
      labels:
        app: ollama-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-kafka-tcp
          image: busybox:1.36
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
                  optional: true
          command: ["sh", "-c"]
          args:
            - |
              set -e
              raw="${KAFKA_BROKER:-kafka-0.kafka-headless:9093}"
              first="${raw%%,*}"
              host="${first%%:*}"
              port="${first##*:}"
              if [ "$port" = "$host" ]; then port=9093; fi
              echo "[wait-kafka-tcp] until nc -z $host $port"
              i=0
              until nc -z "$host" "$port" 2>/dev/null; do
                i=$((i+1))
                if [ "$i" -gt 180 ]; then echo "[wait-kafka-tcp] timeout"; exit 1; fi
                sleep 2
              done
              echo "[wait-kafka-tcp] ok"
      containers:
        - name: gateway
          image: ollama-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: RP_SERVICE_NAME
              value: "ollama-gateway"
            - name: SERVICE_NAME
              value: "ollama-gateway"
            - name: OTEL_SERVICE_NAME
              value: "ollama-gateway"
            - name: RP_KAFKA_CLIENT_ID_STRICT
              value: "1"
            - name: RP_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RP_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OLLAMA_URL
              value: "http://ollama:11434"
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OLLAMA_MODEL
                  optional: true
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
                  optional: true
            - name: KAFKA_SSL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_SSL_ENABLED
                  optional: true
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/secrets/ca-cert.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/secrets/client.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/secrets/client.key"
            - name: KAFKA_ENABLED
              value: "1"
            - name: OLLAMA_JOBS_TOPIC
              value: "ollama-jobs"
            - name: EMBEDDING_DIM
              value: "768"
          ports:
            - name: http
              containerPort: 8081
          volumeMounts:
            - name: kafka-ssl
              mountPath: /etc/kafka/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: kafka-ssl
          secret:
            secretName: kafka-ssl-secret
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
