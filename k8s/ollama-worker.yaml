# Source-built ollama-worker image (exact-SHA pin participant). Apply after Kafka + kafka-ssl-secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-worker
  namespace: record-platform
  labels:
    app: ollama-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ollama-worker
  template:
    metadata:
      labels:
        app: ollama-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-kafka-tcp
          image: busybox:1.36
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
                  optional: true
          command: ["sh", "-c"]
          args:
            - |
              set -e
              raw="${KAFKA_BROKER:-kafka-0.kafka-headless:9093}"
              first="${raw%%,*}"
              host="${first%%:*}"
              port="${first##*:}"
              if [ "$port" = "$host" ]; then port=9093; fi
              echo "[wait-kafka-tcp] until nc -z $host $port"
              i=0
              until nc -z "$host" "$port" 2>/dev/null; do
                i=$((i+1))
                if [ "$i" -gt 180 ]; then echo "[wait-kafka-tcp] timeout"; exit 1; fi
                sleep 2
              done
              echo "[wait-kafka-tcp] ok"
      containers:
        - name: worker
          image: ollama-worker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: RP_SERVICE_NAME
              value: "ollama-worker"
            - name: SERVICE_NAME
              value: "ollama-worker"
            - name: OTEL_SERVICE_NAME
              value: "ollama-worker"
            - name: RP_KAFKA_CLIENT_ID_STRICT
              value: "1"
            - name: RP_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RP_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OLLAMA_URL
              value: "http://ollama:11434"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
                  optional: true
            - name: KAFKA_SSL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_SSL_ENABLED
                  optional: true
            - name: KAFKA_CA_CERT
              value: "/etc/kafka/client/ca-chain.pem"
            - name: KAFKA_CLIENT_CERT
              value: "/etc/kafka/client/tls.crt"
            - name: KAFKA_CLIENT_KEY
              value: "/etc/kafka/client/tls.key"
            - name: OLLAMA_JOBS_TOPIC
              value: "ollama-jobs"
            - name: OLLAMA_DLQ_TOPIC
              value: "ollama-jobs-dlq"
            - name: OLLAMA_WORKER_METRICS_PORT
              value: "9100"
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OLLAMA_MODEL
                  optional: true
          volumeMounts:
            - name: kafka-client-tls
              mountPath: /etc/kafka/client
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: kafka-client-tls
          secret:
            secretName: kafka-client-tls-ollama-worker
            defaultMode: 420
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
            - key: ca-chain.pem
              path: ca-chain.pem
