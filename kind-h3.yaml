kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: h3
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: UDP
  # NodePort mapping for Caddy H3 service (port 30443)
  - containerPort: 30443
    hostPort: 30443
    protocol: TCP
  - containerPort: 30443
    hostPort: 30443
    protocol: UDP
