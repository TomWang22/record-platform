kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: h3

nodes:
  - role: control-plane
    kubeadmConfigPatches:
    - |
      kind: ClusterConfiguration
      apiServer:
        extraArgs:
          bind-address: "0.0.0.0"
    extraPortMappings:
    - containerPort: 443
      hostPort: 8443
      protocol: TCP
    - containerPort: 443
      hostPort: 8443
      protocol: UDP
    - containerPort: 30443
      hostPort: 30443
      protocol: TCP
    - containerPort: 30443
      hostPort: 30443
      protocol: UDP
  - role: worker
  - role: worker
